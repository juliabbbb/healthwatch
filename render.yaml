# Render blueprint for HEALTHWATCH.
# Deploy: Render Dashboard -> New -> Blueprint -> select this repo.
# Secrets (sync: false) are prompted at deploy time and never stored in the file.

services:
  - type: web
    name: healthwatch-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        fromService:
          name: healthwatch-frontend
          type: web
          property: url
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: healthwatch-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: VITE_API_URL
        fromService:
          name: healthwatch-api
          type: web
          property: url
      - key: VITE_CARTO_API_KEY
        sync: false